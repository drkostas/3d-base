[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-base"
version = "0.4.0"
description = "Headless pictures of 3D meshes with correct occlusion and smooth shading, and a health check for exported STL files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Konstantinos Georgiou" }]
dependencies = ["numpy>=1.22", "trimesh>=3.20", "scipy>=1.8", "rtree>=1.0", "fast-simplification>=0.1", "scikit-image>=0.21"]
keywords = ["3d", "mesh", "stl", "render", "headless", "trimesh", "3d-printing", "cad"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics :: 3D Rendering"]

[project.urls]
Homepage = "https://github.com/drkostas/3d-base"

[project.scripts]
3d-base = "base3d.cli:main"

[project.optional-dependencies]
captions = ["pillow>=10.1"]
sections = ["shapely>=2.0", "mapbox-earcut>=1.0", "networkx>=3.0"]
test = ["pytest>=8", "pillow>=10.1", "shapely>=2.0", "mapbox-earcut>=1.0", "networkx>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
base3d = ["skill/SKILL.md"]
